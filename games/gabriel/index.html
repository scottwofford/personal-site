<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel's Star Wars Game ⚔️</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b0d2b 0%, #3a0ca3 100%);
            font-family: 'Arial', sans-serif;
        }
        #game-container {
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.75);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
        }
        h1 { margin: 0 0 10px 0; font-size: 20px; }
        .controls { margin-top: 10px; font-size: 12px; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="info">
        <h1>⚔️ Gabriel's Star Wars Game</h1>
        <div class="controls">
            <strong>Fly / Volar:</strong> ← → ↑ ↓<br>
            <strong>Lightsaber / Sable:</strong> SPACE / ESPACIO<br>
            <strong>👾 Malos:</strong> destroy them / destrúyelos<br>
            <strong>👽 Extraterrestres:</strong> dodge them / esquívalos<br>
            <strong>🌋 Volcanes:</strong> never touch / no los toques
        </div>
    </div>
    <div id="game-container"></div>
    <script src="game.js"></script>
</body>
</html>
